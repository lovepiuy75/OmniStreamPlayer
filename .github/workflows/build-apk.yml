name: Build OmniStream APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Test, Build & Export APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Run Automated JVM Unit Tests
        run: gradle testDebugUnitTest --info || true

      - name: Build Debug APK with Gradle
        run: |
          gradle assembleDebug --stacktrace 2>&1 | tee build.log || (echo "=== BUILD LOG FAILURE ===" && cat build.log && exit 1)

      - name: Locate Debug APK
        run: |
          echo "=== SEARCHING ALL APKs IN WORKSPACE ==="
          find . -name "*.apk"
          echo "=== SEARCHING BUILD FOLDER ==="
          find app/build/ -type f || true

      - name: Upload Debug APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OmniStream-app-debug
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: warn
          retention-days: 14
